name: Publish to PyPI

on:
  pull_request:
  push:
    branches:
      - "0.1.x"
  release:
    types:
      - published

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"  # Match pyproject.toml and condacolab.py

      - name: Check module and pyproject.toml are in sync
        run: python scripts/check_in_sync.py

      - name: Install build tools
        run: python -m pip install --upgrade pip wheel setuptools build twine

      - name: Build wheels
        run: python -m build --sdist --wheel . --outdir dist

      - name: Check wheels
        working-directory: dist
        run: |
          ls -alh
          python -m pip install *.whl
          python -m twine check *

      - name: Upload release distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dists
          path: dist/

  publish:
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    needs: [build]
    environment: 'publish'
    permissions:
      id-token: write

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dists
          path: dist/
      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
