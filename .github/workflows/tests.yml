name: CI

on:
  # GitHub has started calling new repo's first branch "main" https://github.com/github/renaming
  # Existing codes likely still have "master" as the primary branch
  # Both are tracked here to keep legacy and new codes working
  push:
    branches:
      - "0.1.x"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}  # zizmor: ignore[unpinned-images]
      options: --user root
    env:
      PYTHONUNBUFFERED: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CPU
            image: us-docker.pkg.dev/colab-images/public/cpu-runtime:latest
          - name: GPU
            image: us-docker.pkg.dev/colab-images/public/runtime:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify Environment Alignment
        run: |
          echo "=== Container OS Info ==="
          cat /etc/os-release
          echo "=== Container Python Executable ==="
          which python3
          python3 --version

      - name: Install condacolab
        run: |
          python3 -m pip install .

      - name: Run installation
        shell: python3 {0}
        run: |
          import condacolab
          condacolab.install(restart_kernel=False)

      - name: Check installation
        shell: python3 {0}
        run: |
          import os
          import sys
          print("sys.executable:", sys.executable)
          print("sys.path", *sys.path, sep="\n")
          
          print("Checking colab_kernel_launcher")
          import colab_kernel_launcher

          print("Checking google.colab._kernel")
          import google.colab._kernel

      - name: Test solver and constraints
        env:
          PIXI_NO_INSTALL: "true"
        run: |
          set -x
          pixi add python
          pixi add cuda-version
          pixi add openmm
