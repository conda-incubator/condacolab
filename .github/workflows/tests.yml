name: CI

on:
  push:
    branches:
      - "main"
      - "0.1.x"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CPU
            image: us-docker.pkg.dev/colab-images/public/cpu-runtime:latest
          - name: GPU
            image: us-docker.pkg.dev/colab-images/public/runtime:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install & test
        run: |
          PYTHON_VERSIONS=("3.10" "3.11" "3.12" "3.13" "3.14")
          IMAGE="${{ matrix.image }}"

          for PY in "${PYTHON_VERSIONS[@]}"; do
            echo "::group::Testing Python $PY for ${{ matrix.name }}"
            echo "=================================================="
            echo " Testing Python $PY for ${{ matrix.name }}"
            echo "=================================================="

            # Clean generated files between runs
            git clean -fdx 2>/dev/null || true

            docker run --rm \
              --entrypoint "" \
              --user root \
              -v "${{ github.workspace }}:/content" \
              -w /content \
              -e PYTHONUNBUFFERED="1" \
              -e PIXI_NO_INSTALL="true" \
              "$IMAGE" \
              bash -exc "
                echo '=== Container OS Info ==='
                cat /etc/os-release

                echo '=== Container Python Executable ==='
                which python3
                python3 --version

                echo '=== Install condacolab ==='
                python3 -m pip install .

                echo '=== Run installation ==='
                python3 -c 'import condacolab; condacolab.install(python_version=\"$PY\", restart_kernel=False)'

                echo '=== Check installation ==='
                python3 -c 'import sys; print(\"sys.executable:\", sys.executable)'
                python3 -c 'import sys; print(\"sys.version:\", sys.version)'
                python3 -c 'import sys; print(\"sys.path:\", *sys.path, sep=\"\n\")'
                python3 -c 'import colab_kernel_launcher'
                python3 -c 'import google.colab._kernel'

                echo '=== Test solver and constraints for Python $PY ==='
                pixi add python=\"$PY\"
                pixi add cuda-version
                pixi add openmm
              "
            echo "::endgroup::"
          done
